[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedward"
version = "0.1.0"
description = "Small, self-hostable website performance tester using the Globalping API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "django>=5.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "typer>=0.12",
  "click>=8.2",   # floor only: CliRunner separates stdout/stderr from 8.2 (tests rely on it)
  "whitenoise>=6.6",
  "gunicorn>=26",
]

[project.optional-dependencies]
geoip = ["maxminddb>=2.5"]
browser = ["playwright>=1.44"]  # reserved for the real-browser page test, not built yet (--browser is a stub)
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.6", "rust-just>=1.30"]  # rust-just ships the `just` task runner (see justfile)
e2e = ["pytest-playwright>=0.5", "gunicorn", "axe-playwright-python>=0.1.4", "httpx"]

[project.scripts]
speedward = "speedward.cli.main:app"

[tool.setuptools.packages.find]
include = ["speedward*"]

[tool.setuptools.package-data]
speedward = ["core/*.json", "reports/*.j2", "reports/*.json", "web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "speedward.web.settings"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
target-version = "py311"
# The code base is written with long lines and is not run through a formatter; 150 fits all but one line.
line-length = 150
extend-exclude = ["speedward.egg-info"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import order, B bugbear, UP pyupgrade, S bandit (checked on app code only, see per-file-ignores).
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B905",  # zip() without strict=: lengths are equal by construction; strict= would add a new runtime failure mode
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]    # asserts, dummy tokens and throwaway servers are normal in tests
"e2e/**" = ["S"]      # same as tests; also starts a local gunicorn subprocess on purpose
"scripts/**" = ["S"]  # developer scripts, not shipped
"speedward/cli/main.py" = ["B008"]  # typer declares options as call expressions in defaults (its documented API)
"tests/test_map.py" = ["B008"]      # ServerPosition is an immutable value used as a default in a test helper
