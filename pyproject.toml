[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedward"
version = "0.1.0"
description = "Small, self-hostable website performance tester using the Globalping API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "django>=5.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "typer>=0.12",
  "click>=8.2",   # floor only: CliRunner separates stdout/stderr from 8.2 (tests rely on it)
  "whitenoise>=6.6",
  "gunicorn>=22",
]

[project.optional-dependencies]
geoip = ["maxminddb>=2.5"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-django>=4.8"]
e2e = ["pytest-playwright>=0.5", "gunicorn", "axe-playwright-python>=0.1.4", "httpx"]

[project.scripts]
speedward = "speedward.cli.main:app"

[tool.setuptools.packages.find]
include = ["speedward*"]

[tool.setuptools.package-data]
speedward = ["reports/*.j2", "web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DJANGO_SETTINGS_MODULE = "speedward.web.settings"  # enable once speedward/web/settings.py exists (web task)
filterwarnings = ["ignore:No directory at:UserWarning"]
