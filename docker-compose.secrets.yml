# Optional: read the MaxMind account ID and licence key from files instead of .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Put the values in ./secrets/maxmind_account_id and ./secrets/maxmind_license_key (mode 600, never
# committed: .gitignore and .dockerignore exclude secrets/). Use ONE route: with this file, leave
# GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY empty in .env. The environment list below
# replaces the one in docker-compose.yml (!override), so the plain variables are not passed at all.

services:
  geoipupdate:
    environment: !override
      GEOIPUPDATE_ACCOUNT_ID_FILE: /run/secrets/maxmind_account_id
      GEOIPUPDATE_LICENSE_KEY_FILE: /run/secrets/maxmind_license_key
      GEOIPUPDATE_EDITION_IDS: ${GEOIPUPDATE_EDITION_IDS:-GeoLite2-City}
      GEOIPUPDATE_FREQUENCY: "84"
      GEOIPUPDATE_DB_DIR: /usr/share/GeoIP
    secrets:
      - maxmind_account_id
      - maxmind_license_key

secrets:
  maxmind_account_id:
    file: ./secrets/maxmind_account_id
  maxmind_license_key:
    file: ./secrets/maxmind_license_key
